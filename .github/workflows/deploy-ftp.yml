name: Deploy to FTP

on:
  push:
    branches: [ 'main' ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Checkout agrumi-app (demo source)
        uses: actions/checkout@v4
        with:
          repository: LuigiOliv/agrumi-app
          path: .siblings/agrumi-app

      - name: Checkout rugby-app (demo source)
        uses: actions/checkout@v4
        with:
          repository: LuigiOliv/rugby-app
          path: .siblings/rugby-app

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build with Vite
        run: npm run build
        env:
          SIBLING_APPS_DIR: ${{ github.workspace }}/.siblings

      - name: Deploy to FTP server
        uses: SamKirkland/FTP-Deploy-Action@4.3.0
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftp
          port: 21
          local-dir: ./dist/
          server-dir: ${{ secrets.FTP_SERVER_DIR }}
          security: loose
